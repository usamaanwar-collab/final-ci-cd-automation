name: Python Gatekeeper

on: [push]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install Pytest
        run: pip install pytest
      - name: Run Tests
        run: python3 -m pytest
